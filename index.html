<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Critical fonts (hero / preloader / project titles): fetch them alongside the
         JS bundle instead of after React renders, avoiding a late font swap. -->
    <link rel="preload" href="/fonts/gilda-display-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Geist-Bold.woff2" as="font" type="font/woff2" crossorigin />

    <!-- portfolio-metadata:start -->
    <!-- Generated from src/utils/pageMetadata.ts by the seo-documents Vite plugin. -->
    <title>TJC | Creative Product Designer</title>
    <!-- portfolio-metadata:end -->

    <!-- Build-time prerendered content (see src/prerender/entry.tsx): readable by crawlers
         that do not run JavaScript. It stays out of view while the app boots (React replaces
         it on first render) and only appears if JavaScript never runs. -->
    <style>
      .prerendered {
        visibility: hidden;
        max-height: 0;
        overflow: hidden;
        animation: prerendered-reveal 0s 5s forwards;
      }
      @keyframes prerendered-reveal {
        to {
          visibility: visible;
          max-height: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
